# ── Netlify configuration for lakedistrictescapes.uk ──
# This file MUST live at the repository root so Netlify reads it automatically.
# The Astro project lives in the `site/` sub-directory, so `base` points there;
# all other paths below (command, publish, functions, edge functions) resolve
# relative to that base directory.

[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serverless (Netlify) Functions — the guest book API (site/netlify/functions).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Edge Functions — host-based routing so the `guest.` sub-domain serves the
# guest book as its landing page (site/netlify/edge-functions/subdomain-router.js).
[[edge_functions]]
  path = "/"
  function = "subdomain-router"

# Nice, short URLs.
[[redirects]]
  from = "/rockery"
  to = "/the-rockery/"
  status = 301
  force = true

[[redirects]]
  from = "/cottage"
  to = "/primrose-cottage/"
  status = 301
  force = true

# Security & caching headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
