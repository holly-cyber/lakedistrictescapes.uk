<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lake District fells at sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7bccd"/>
      <stop offset="0.52" stop-color="#e8c6a2"/>
      <stop offset="1" stop-color="#f2ac61"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.36" cy="1" r="0.55">
      <stop offset="0" stop-color="#ffeccb"/>
      <stop offset="1" stop-color="#ffeccb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="64" height="64" rx="13"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <!-- sun glow sitting in the horizon dip -->
    <ellipse cx="23" cy="42" rx="22" ry="10" fill="url(#sun)"/>
    <!-- far fells: rolling profile with one prominent peak -->
    <path d="M0 41 C7 39.5 11 40.5 16 39 C20 37.8 21 40.5 25 40 C29 39.4 31 31.5 35 31 C39 30.6 41 36 46 35.5 C52 35 59 37 64 36 L64 64 L0 64 Z"
          fill="#5c6178"/>
    <!-- near fells -->
    <path d="M0 46 C9 44.5 15 45.5 23 44 C29 42.9 34 44.2 41 44 C49 43.8 57 45.4 64 44.4 L64 64 L0 64 Z"
          fill="#3b4053"/>
    <!-- foreground field / dry-stone walls -->
    <path d="M0 54 C12 52.4 23 53.4 34 52.6 C45 51.8 56 53.2 64 52.4 L64 64 L0 64 Z"
          fill="#262a37"/>
  </g>
</svg>
